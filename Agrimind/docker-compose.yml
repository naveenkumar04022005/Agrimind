version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimind_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrimind}
      POSTGRES_USER: ${POSTGRES_USER:-agrimind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrimind_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrimind} -d ${POSTGRES_DB:-agrimind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web-based database management interface
  adminer:
    image: adminer:latest
    container_name: agrimind_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
